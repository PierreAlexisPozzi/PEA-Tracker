<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- page:start -->
<title>PEA Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: en-tête compact + barre d'onglets, une colonne de panneaux ; les tableaux denses défilent dans leur propre conteneur. */
:root {
  --bg: #eef1f4;
  --surface: #fcfdfd;
  --surface-2: #f4f6f8;
  --ink: #111821;
  --ink-2: #465262;
  --muted: #6c7783;
  --line: #dbe1e7;
  --line-strong: #c3ccd6;
  --accent: #1f5fa8;
  --accent-ink: #ffffff;
  --accent-soft: #e2ebf6;
  --up: #0b6b2c;
  --down: #b8322a;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --gain: #2a78d6;
  --loss: #e34948;
  --good: #0ca30c;
  --warn: #fab219;
  --serious: #ec835a;
  --crit: #d03b3b;
  --a1: #1c5cab;
  --a2: #6da7ec;
  --a3: #b9bdc2;
  --a4: #f0a09f;
  --a5: #d03b3b;
  --shadow: 0 1px 2px rgba(17, 24, 33, .06), 0 8px 24px rgba(17, 24, 33, .06);
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318; --surface: #151c24; --surface-2: #1b232d; --ink: #edf1f5; --ink-2: #b4bfca; --muted: #8995a2;
    --line: #27313c; --line-strong: #36424f; --accent: #6aa5ee; --accent-ink: #0b1420; --accent-soft: #1b2a3d;
    --up: #3fc46a; --down: #f07a72; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --gain: #3987e5; --loss: #e66767;
    --a1: #3987e5; --a2: #1f4f86; --a3: #4a525b; --a4: #7a3a3a; --a5: #e66767;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1318; --surface: #151c24; --surface-2: #1b232d; --ink: #edf1f5; --ink-2: #b4bfca; --muted: #8995a2;
  --line: #27313c; --line-strong: #36424f; --accent: #6aa5ee; --accent-ink: #0b1420; --accent-soft: #1b2a3d;
  --up: #3fc46a; --down: #f07a72; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --gain: #3987e5; --loss: #e66767;
  --a1: #3987e5; --a2: #1f4f86; --a3: #4a525b; --a4: #7a3a3a; --a5: #e66767;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--font-display); font-stretch: 87.5%; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .84rem; }
.up { color: var(--up); }
.down { color: var(--down); }
.eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.app { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 64px; display: grid; gap: 18px; }

/* En-tête */
.top { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
.brand { display: grid; gap: 4px; min-width: 0; }
.brand h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); font-weight: 800; font-stretch: 80%; letter-spacing: -.02em; }
.brand h1 span { color: var(--accent); }
.brand .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ink-2); font-size: .88rem; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: .9rem; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.danger { color: var(--down); }
.btn.sm { padding: 5px 10px; font-size: .82rem; }
.btn svg { width: 16px; height: 16px; flex: none; }
select.input, input.input, textarea.input { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; max-width: 100%; }
.store-badge { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); }
.store-badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.store-badge.cloud i { background: var(--good); }

/* Onglets */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-top: 4px; }
.tab { border: 0; background: transparent; padding: 10px 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 8px; align-items: center; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .count { font-size: .72rem; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.tab .count.alert { background: var(--crit); color: #fff; border-color: transparent; }
.tab .count.warn { background: var(--warn); color: #241a00; border-color: transparent; }

.panel { display: grid; gap: 18px; }
.section { display: grid; gap: 12px; align-content: start; }
.section-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.kpi { background: var(--surface); padding: 14px 16px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.kpi .label { font-size: .8rem; color: var(--ink-2); font-weight: 500; }
.kpi .value { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.kpi .value.hero { font-size: clamp(2rem, 5vw, 2.6rem); }
.kpi .sub { font-size: .82rem; color: var(--muted); }

/* Jauge de santé */
.health { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.ring { width: 92px; height: 92px; }
.health-legend { display: flex; flex-wrap: wrap; gap: 8px; }

/* Pastilles d'état et de recommandation */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 6px; border-radius: 99px; font-size: .78rem; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; color: var(--ink); }
.chip .ico { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; line-height: 1; }
.chip.ok .ico { background: var(--good); }
.chip.warn .ico { background: var(--warn); color: #241a00; }
.chip.alert .ico { background: var(--crit); }
.chip.info .ico { background: var(--muted); }
.reco { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; padding: 3px 9px; border-radius: 6px; white-space: nowrap; border: 1px solid transparent; }
.reco::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.reco.r-buy { background: var(--accent-soft); color: var(--accent); }
.reco.r-hold { background: var(--surface-2); color: var(--ink-2); border-color: var(--line); }
.reco.r-reduce { background: color-mix(in srgb, var(--serious) 18%, var(--surface)); color: var(--ink); }
.reco.r-reduce::before { background: var(--serious); }
.reco.r-sell { background: color-mix(in srgb, var(--crit) 14%, var(--surface)); color: var(--down); }
.reco.r-none { background: transparent; color: var(--muted); border-color: var(--line); }
.reco.r-none::before { display: none; }

/* Tableaux */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
table.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tbl th, .tbl td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
.tbl th button { all: unset; cursor: pointer; }
.tbl th button:focus-visible { outline: 2px solid var(--accent); }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl td.r { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl tbody tr.clickable:hover td { background: var(--surface-2); }
.tbl td .actions { flex-wrap: nowrap; }
.tbl tfoot td { font-weight: 700; background: var(--surface-2); border-top: 1px solid var(--line-strong); }
.name-cell { display: grid; gap: 1px; min-width: 180px; }
.name-cell b { font-weight: 600; }
.name-cell span { font-size: .76rem; color: var(--muted); }
.wbar { display: grid; grid-template-columns: 1fr 44px; gap: 8px; align-items: center; min-width: 110px; }
.wbar .track { height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.wbar .fill { height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
.wbar .fill.over { background: var(--serious); }

/* Barre de répartition des avis analystes */
.abar { display: flex; gap: 2px; height: 8px; width: 96px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.abar i { display: block; height: 100%; }
.alegend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--ink-2); }
.alegend span { display: inline-flex; gap: 6px; align-items: center; }
.alegend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* Graphiques */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--ink-2); font: 12px var(--font-body); font-variant-numeric: tabular-nums; }
.chart .axis { stroke: var(--line-strong); stroke-width: 1; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: default; }
.chart .lbl-strong { fill: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .8rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.stack { display: flex; gap: 2px; height: 28px; border-radius: 6px; overflow: hidden; }
.stack div { height: 100%; display: grid; place-items: center; font-size: .78rem; font-weight: 700; color: #fff; min-width: 0; overflow: visible; white-space: nowrap; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 8px; font-size: .8rem; line-height: 1.35; max-width: 260px; box-shadow: var(--shadow); }
#tip b { font-weight: 700; }

/* Contrôles */
.ctrl-list { display: grid; gap: 10px; }
.ctrl { display: grid; grid-template-columns: 6px 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.ctrl .stripe { background: var(--muted); }
.ctrl.ok .stripe { background: var(--good); }
.ctrl.warn .stripe { background: var(--warn); }
.ctrl.alert .stripe { background: var(--crit); }
.ctrl .body { padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.ctrl .row1 { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; }
.ctrl .title { font-weight: 700; }
.ctrl .code { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.ctrl .detail { color: var(--ink-2); font-size: .88rem; }
.ctrl .action { font-size: .86rem; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; }
.ctrl .action b { font-weight: 700; }
.ctrl-summary { display: flex; flex-wrap: wrap; gap: 8px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { border: 1px solid var(--line-strong); background: var(--surface); padding: 5px 12px; border-radius: 99px; font-size: .82rem; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.seg[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Flux */
.pipeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; counter-reset: step; }
.step { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 6px; align-content: start; box-shadow: var(--shadow); min-width: 0; }
.step .n { font-family: var(--font-display); font-stretch: 80%; font-weight: 800; color: var(--accent); font-size: .9rem; }
.step .t { font-weight: 700; font-size: .92rem; }
.step .d { font-size: .8rem; color: var(--ink-2); }
.step .chip { white-space: normal; justify-self: start; }

/* Idées */
.idea { display: grid; gap: 10px; align-content: start; }
.idea-head { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; }
.idea-head h3 { font-size: 1.08rem; }
.score { display: grid; justify-items: end; gap: 2px; }
.score b { font-family: var(--font-display); font-stretch: 80%; font-size: 1.5rem; font-weight: 800; line-height: 1; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.facts div { background: var(--surface-2); border-radius: 6px; padding: 6px 8px; display: grid; gap: 1px; min-width: 0; }
.facts span { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.facts b { font-size: .95rem; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.plain { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--ink-2); font-size: .88rem; }
.plain b { color: var(--ink); }
.plain .chip { vertical-align: 1px; }
.prose { display: grid; gap: 6px; max-width: 80ch; }
.prose h3 { margin-top: 8px; }
.prose p { color: var(--ink); }
.prose .plain { color: var(--ink); font-size: .92rem; }

/* Barres horizontales et divergentes (HTML, nettes à toute largeur) */
.hb, .db { display: grid; gap: 2px; }
.hb-row { display: grid; grid-template-columns: minmax(90px, 38%) minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: .84rem; padding: 4px 6px; border-radius: 6px; }
.db-row { display: grid; grid-template-columns: minmax(90px, 34%) minmax(0, 1fr) minmax(0, 1fr) 64px; column-gap: 0; align-items: center; font-size: .84rem; padding: 4px 6px; border-radius: 6px; }
.hb-row:hover, .db-row:hover, .hb-row:focus-visible, .db-row:focus-visible { background: var(--surface-2); }
.hb-label { color: var(--ink); overflow-wrap: anywhere; padding-right: 10px; }
.hb-track { height: 14px; display: block; }
.hb-track i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.hb-val { text-align: right; color: var(--ink-2); padding-left: 8px; }
.db-neg, .db-pos { height: 14px; display: flex; }
.db-neg { justify-content: flex-end; border-right: 1px solid var(--line-strong); }
.db-neg i { display: block; height: 100%; background: var(--loss); border-radius: 4px 0 0 4px; }
.db-pos i { display: block; height: 100%; background: var(--gain); border-radius: 0 4px 4px 0; }

/* Formulaires */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: .78rem; font-weight: 600; color: var(--ink-2); }
.field .input { width: 100%; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: .88rem; }

/* Feuille modale (import, réglages, détail) */
.sheet { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(8, 12, 18, .55); }
.sheet-card { background: var(--surface); color: var(--ink); width: min(760px, 100%); max-height: min(88vh, 900px); overflow: auto; border-radius: 14px; box-shadow: var(--shadow); display: grid; gap: 14px; padding: 18px; }
.sheet-head { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
.checklist { display: grid; gap: 8px; }
.checklist .item { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.checklist .item .d { font-size: .82rem; color: var(--ink-2); }

.empty { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 22px; display: grid; gap: 10px; justify-items: start; background: var(--surface); }
.banner { border-radius: var(--radius); padding: 10px 14px; background: var(--accent-soft); color: var(--ink); font-size: .88rem; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.note { font-size: .8rem; color: var(--muted); max-width: 80ch; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.drop { border: 2px dashed var(--line-strong); border-radius: var(--radius); padding: 18px; display: grid; gap: 8px; justify-items: center; text-align: center; background: var(--surface-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop.update { grid-template-columns: minmax(0, 1fr) auto; justify-items: stretch; align-items: center; text-align: left; gap: 12px 18px; padding: 14px 16px; background: var(--surface); }
.drop.update.stale { border-color: var(--warn); }
.update-text { display: grid; gap: 2px; min-width: 0; }
.update-text b { font-family: var(--font-display); font-stretch: 87.5%; font-size: 1.05rem; }
body.dragging .drop { border-color: var(--accent); background: var(--accent-soft); }
body.dragging::after { content: "Déposez le fichier pour mettre à jour le relevé"; position: fixed; inset: 12px; z-index: 70; display: grid; place-items: center; padding: 16px; text-align: center; border: 3px dashed var(--accent); border-radius: 16px; background: color-mix(in srgb, var(--bg) 85%, transparent); color: var(--ink); font: 700 1.2rem var(--font-display); pointer-events: none; }
details.paste { display: grid; gap: 8px; }
details.paste summary { cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--accent); }
details.paste textarea { width: 100%; font: .82rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
@media (max-width: 560px) { .drop.update { grid-template-columns: 1fr; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; opacity: 0; pointer-events: none; }

@media (max-width: 560px) {
  .tab { padding: 9px 10px; font-size: .9rem; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi .value { font-size: 1.35rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<!-- page:head-end -->
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Plan d'épargne en actions</span>
      <h1>PEA <span>Tracker</span></h1>
      <div class="meta" id="meta"><span>Chargement des données…</span></div>
    </div>
    <div class="actions">
      <label class="sr" for="snapSelect">Relevé affiché</label>
      <select class="input" id="snapSelect" hidden></select>
